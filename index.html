<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MENDI Training">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>MENDI Training</title>
<style>
:root{--bg:#0c0d0f;--card:#17191c;--card2:#0f1113;--line:#2a2e33;--txt:#ece6d8;--mut:#9b9a93;--run:#f97316;--ride:#38bdf8;--ok:#4ade80;--warn:#facc15;--ko:#f87171;
--k-base:#38bdf8;--k-spec:#f97316;--k-recup:#4ade80;--k-taper:#a78bfa;--k-race:#facc15;--k-post:#9b9a93}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 16px calc(80px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.lg{width:42px;height:42px;border-radius:9px;flex:none}
h1{margin:0;font-size:19px;letter-spacing:.14em;font-weight:800}
h1 span{font-weight:400;letter-spacing:.06em;color:var(--mut)}
.sub{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sy{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:20px;flex:none}
nav{
  position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;
  background:rgba(8,9,10,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid rgba(236,230,216,.09);
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 30px rgba(0,0,0,.18)
}
nav button{
  position:relative;flex:1;min-width:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;padding:3px 0 2px;
  background:none;border:0;color:#777a7d;font-family:inherit;font-size:10px;font-weight:500;line-height:1.1;
  cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .2s ease
}
nav button .nav-icon{
  width:38px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:10px;transition:background .2s ease,transform .2s ease
}
nav button svg{
  width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.65;
  stroke-linecap:round;stroke-linejoin:round;display:block
}
nav button .nav-label{font-size:10px;letter-spacing:.015em;white-space:nowrap}
nav button.on{color:var(--run);font-weight:650}
nav button.on .nav-icon{background:rgba(249,115,22,.12);transform:translateY(-1px)}
nav button:focus-visible{outline:1px solid var(--run);outline-offset:-2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){nav button,nav button .nav-icon{transition:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.card h2{margin:0 0 8px;font-size:14px;color:var(--mut);font-weight:600}
.warn{border-color:#a16207;background:#241d08}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi b{display:block;font-size:22px}
.run{color:var(--run)}.ride{color:var(--ride)}.ok{color:var(--ok)}.ko{color:var(--ko)}.wn{color:var(--warn)}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.n{font-weight:600}
.m{color:var(--mut);font-size:13px}
.r{text-align:right;white-space:nowrap;font-size:13px}
.sess{padding:10px 0;border-bottom:1px solid var(--line)}
.sess:last-child{border:0}
.done .n{opacity:.55}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#0c0d0f}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;margin:6px 0 10px}
.bar>div{height:100%;background:var(--ok)}
input,select,textarea,button.b{width:100%;padding:10px;margin:4px 0 10px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:16px;font-family:inherit}
button.b{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:600;margin-bottom:8px}
button.b.alt{background:transparent;border-color:var(--line);color:var(--txt)}
label{font-size:13px;color:var(--mut)}
#log{white-space:pre-wrap;font-size:13px;color:var(--mut);min-height:20px}
a{color:var(--ride)}
small{color:var(--mut)}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.legend span{margin-right:10px;font-size:12px;color:var(--mut)}
ul{padding-left:20px;margin:6px 0}
/* courses à venir */
.cars{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
.rc{flex:0 0 84%;height:190px;border-radius:14px;background-size:cover;background-position:center;position:relative;scroll-snap-align:center;color:#fff;overflow:hidden;border:1px solid var(--line)}
.rc .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.05) 70%)}
.rc .rt{position:absolute;left:14px;right:14px;bottom:12px}
.rc .rn{font-size:20px;font-weight:800;line-height:1.15;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.rc .rm{font-size:13px;color:#ddd}
.rc .pr{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35)}
.rc .jx{position:absolute;top:10px;left:10px;font-size:13px;font-weight:800;padding:2px 10px;border-radius:99px;background:var(--txt);color:#0c0d0f}
/* semaine */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 12px}
.dy{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 1px;text-align:center;font-size:10.5px;min-height:84px;overflow:hidden}
.dy b{display:block;font-size:12px}
.dy .dd{color:var(--mut);font-size:11px}
.dy.today{border-color:var(--txt)}
.dy.past{opacity:.85}
.dy.off{opacity:.55;background:repeating-linear-gradient(45deg,#101215,#101215 6px,#1a1d21 6px,#1a1d21 12px)}
.dy .tg{font-size:9px;font-weight:700;color:var(--ko)}
.dy .pl{color:var(--run);font-weight:600;margin-top:2px}
.dy .pl.dn2{opacity:.45;text-decoration:line-through}
.dy .av{margin-top:2px;font-weight:600}
/* coach */
.msg{padding:8px 10px;border-radius:10px;margin:6px 0;font-size:14px;white-space:pre-wrap}
.msg.u{background:#1d3a6e;margin-left:24px}
.msg.a{background:var(--card2);border:1px solid var(--line);margin-right:12px}
.adv{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0 10px}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px;align-items:center}
.th{width:64px;height:44px;border-radius:8px;background-size:cover;background-position:center;border:2px solid transparent;opacity:.65}
.th.sel{border-color:var(--txt);opacity:1}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid var(--line)}
.gb{height:10px}

/* MENDI Training — identité premium & performance */
:root{--bg:#0a0c0f;--card:#14181d;--card2:#101419;--line:#29313a;--txt:#f2f1ec;--mut:#929ba5;--run:#ff7138;--ride:#55c7f2;--ok:#55d69a;--warn:#f4c95d;--ko:#ff7777}
body{background:radial-gradient(ellipse at 50% -18%,rgba(255,113,56,.09),transparent 42%),var(--bg);letter-spacing:.005em}
.brand{gap:12px}
.lg{border:1px solid rgba(255,255,255,.12);box-shadow:0 5px 18px rgba(0,0,0,.28)}
h1{font-size:18px;letter-spacing:.16em;font-weight:850;line-height:1.05}
h1 span{display:block;margin-top:4px;font-size:9px;font-weight:750;letter-spacing:.27em;color:var(--mut)}
.sub{margin-top:4px}
.card{background:linear-gradient(145deg,rgba(25,30,36,.98),rgba(18,22,27,.98));border:1px solid rgba(174,190,205,.13);border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.card h2{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:#aeb7c0}
.kpi b{font-size:25px;letter-spacing:-.035em;font-weight:780}
.pill{font-size:10px;letter-spacing:.045em;text-transform:uppercase}
button.b{background:linear-gradient(135deg,#ff7a3d,#e85b25);border-color:#ff7a3d;box-shadow:0 5px 16px rgba(255,113,56,.16)}
button.b.alt{background:rgba(255,255,255,.025)}
input:focus,select:focus,textarea:focus,button.b:focus-visible,#sy:focus-visible{outline:2px solid rgba(255,113,56,.72);outline-offset:2px;border-color:var(--run)}
#sy{background:linear-gradient(145deg,#1b2229,#11161b);border-color:rgba(174,190,205,.18)}
nav{background:rgba(9,12,15,.88);border-top-color:rgba(174,190,205,.13);box-shadow:0 -12px 34px rgba(0,0,0,.32)}
nav button.on .nav-icon{background:linear-gradient(145deg,rgba(255,113,56,.19),rgba(255,113,56,.07));box-shadow:inset 0 0 0 1px rgba(255,113,56,.12)}
.rc{border-radius:17px;border:0;box-shadow:none}
.rc .pr{border:0}
.msg.u{background:rgba(37,99,235,.22);border:1px solid rgba(85,199,242,.15)}
.msg.a,.adv{background:#11161b;border-color:rgba(174,190,205,.13)}
@media(min-width:700px){body{max-width:760px;margin:0 auto}.cars{margin-left:-16px;margin-right:-16px}}


/* Coach MENDI — page dédiée et historique indépendant */
nav button{font-size:9px}
nav button .nav-label{font-size:9px;letter-spacing:0}
.coach-hero{background:linear-gradient(145deg,rgba(30,43,54,.98),rgba(17,23,29,.98));border:1px solid rgba(85,199,242,.18);border-radius:18px;padding:16px;margin:12px 0}
.coach-shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.coach-shortcuts button{margin:0;text-align:left;background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:10px;font-size:13px}
.coach-chat{display:flex;flex-direction:column;gap:8px}
.coach-messages{display:flex;flex-direction:column;gap:5px;max-height:none;overflow:visible}
.coach-compose{position:sticky;bottom:72px;background:rgba(23,31,39,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(174,190,205,.18);border-radius:16px;padding:10px;margin:12px 0 calc(8px + env(safe-area-inset-bottom));z-index:5;display:flex;gap:8px;align-items:flex-end;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.coach-compose input{margin:0;min-width:0;flex:1;background:rgba(255,255,255,.06);border-color:rgba(174,190,205,.2)}
.coach-compose button{width:auto;min-width:48px;margin:0;padding:10px 14px}
.chat-tools{display:flex;gap:8px;flex-wrap:wrap}
.chat-tools button{width:auto;margin:0;font-size:12px;padding:8px 10px}
.archive-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.archive-item:last-child{border:0}
.archive-item .archive-title{min-width:0;flex:1}
.archive-item button{width:auto;margin:0;padding:7px 9px;font-size:12px}
@media(min-width:700px){.coach-compose{bottom:12px}}

</style>
</head>
<body>
<header>
  <div class="brand"><img class="lg" src="logo.png" alt=""><div style="min-width:0"><h1>MENDI <span>TRAINING</span></h1><div class="sub" id="status"></div></div></div>
  <button id="sy" onclick="sync()" title="Synchroniser Strava">↻</button>
</header>
<main id="view"></main>
<nav aria-label="Navigation principale">
  <button data-t="home" aria-label="Accueil">
    <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9M9 20v-6h6v6"/></svg></span>
    <span class="nav-label">Accueil</span>
  </button>
  <button data-t="plan" aria-label="Programme">
    <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M7.5 3v4M16.5 3v4M3.5 10h17M8 14h3M8 17h7"/></svg></span>
    <span class="nav-label">Programme</span>
  </button>
  <button data-t="coach" aria-label="Coach MENDI">
    <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a7 7 0 0 0-4 12.7V19h8v-3.3A7 7 0 0 0 12 3Z"/><path d="M9 22h6M9 16h6M9.5 9.5l1.5 1.5 3-3"/></svg></span>
    <span class="nav-label">Coach</span>
  </button>
  <button data-t="acts" aria-label="Activités">
    <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3l2.2-6 4.1 12 2.5-7 1.5 3H21"/></svg></span>
    <span class="nav-label">Activités</span>
  </button>
  <button data-t="gear" aria-label="Matériel">
    <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="17" r="4"/><circle cx="18" cy="17" r="4"/><path d="m6 17 4-8 4 8H6l3-5h6l3 5M9 9h3M15 7h2"/></svg></span>
    <span class="nav-label">Matériel</span>
  </button>
  <button data-t="cfg" aria-label="Réglages">
    <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.1 1.9-2 2-1.9-1.1a8 8 0 0 1-1.5.6l-.6 2.1h-2.8l-.6-2.1a8 8 0 0 1-1.5-.6L7.8 19l-2-2 1.1-1.9a8 8 0 0 1-.6-1.5L4.2 13v-2.8l2.1-.6a8 8 0 0 1 .6-1.5L5.8 6.2l2-2 1.9 1.1a8 8 0 0 1 1.5-.6l.6-2.1h2.8l.6 2.1a8 8 0 0 1 1.5.6l1.9-1.1 2 2-1.1 1.9a8 8 0 0 1 .6 1.5l2.1.6V13l-2.1.6a8 8 0 0 1-.6 1.4Z"/></svg></span>
    <span class="nav-label">Réglages</span>
  </button>
</nav>

<script>
const $ = s => document.querySelector(s);
const KC = 'bt_cfg', KA = 'bt_acts', KG = 'bt_goals', KP = 'bt_plan', KF = 'bt_prof', KB = 'bt_abs', KO = 'bt_off', KR = 'bt_feel', KM = 'bt_maint', KS = 'bt_gear', KH = 'bt_chat', KJ = 'bt_adj', KX = 'bt_session_edits', KTH = 'bt_chat_threads', KAH = 'bt_chat_archives', KAC = 'bt_chat_active';
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? d : v } catch (e) { return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) { log('Stockage local plein ou indisponible.') } };
let cfg = load(KC, {}), acts = load(KA, []), goals = load(KG, null), plan = load(KP, null), prof = load(KF, {}), absences = load(KB, null),
  offs = load(KO, []), feels = load(KR, []), maint = load(KM, []), gears = load(KS, []), chat = load(KH, []), adj = load(KJ, {}), sessEdits = load(KX, {});
let tab = 'home', filt = 'all', chatBusy = false; const openK = {}, imgSel = {}, imgTmp = {};
let chatThreads = load(KTH, []), archivedChats = load(KAH, []), activeChatId = load(KAC, '');
// Migration de l'ancien historique unique vers une conversation active indépendante.
if (!chatThreads.length) {
  activeChatId = 'mendi-' + Date.now();
  chatThreads = [{ id: activeChatId, title: 'Conversation principale', updated: Date.now(), messages: chat.slice(-30) }];
  save(KTH, chatThreads); save(KAC, activeChatId);
} else if (!chatThreads.some(t => t.id === activeChatId)) {
  activeChatId = chatThreads[0].id; save(KAC, activeChatId);
}
let activeThread = chatThreads.find(t => t.id === activeChatId) || chatThreads[0];
chat = Array.isArray(activeThread.messages) ? activeThread.messages : chat;

// Migration sécurisée : supprime une éventuelle ancienne clé Anthropic stockée localement.
if (cfg.ai) { delete cfg.ai; delete cfg.model; save(KC, cfg); }
const DAY = 864e5, WK = 7 * DAY;
const DN = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'], DS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'], DL = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
const LBL = { l: 'Longue', q: 'Qualité', e: 'Footing', r: 'Course' };
const IMGS = ['trail1.jpg', 'trail2.jpg', 'trail3.jpg'];
const defImg = (g, i) => /montagn|hard|lary/i.test(g.name) ? 'trail1.jpg' : /korrikei|basque/i.test(g.name) ? 'trail2.jpg' : /gravel/i.test(g.name) ? 'trail3.jpg' : IMGS[i % 3];

if (!goals) {
  goals = [
    { id: 'g1', name: 'Montagn’hard 42 km', type: 'trail', date: '2027-05-16', runKm: 42, rideKm: 0, elev: '', prio: 'A', img: 'trail1.jpg', confirmed: false },
    { id: 'g2', name: 'Gravel & trail', type: 'combo', date: '2027-09-18', runKm: 21, rideKm: 125, elev: '', prio: 'A', img: 'trail3.jpg', confirmed: false },
    { id: 'g3', name: 'Korrikei (Pays basque)', type: 'trail', date: '2026-11-22', runKm: 22, rideKm: 0, elev: '', prio: 'B', img: 'trail2.jpg', confirmed: true }
  ];
  save(KG, goals);
}
if (!absences) {
  absences = [{ id: 'a1', name: 'Philippines', start: '2027-02-08', end: '2027-03-08', runPct: 50, bike: false, confirmed: false }];
  save(KB, absences);
}

/* ---------- Outils ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pad = n => String(n).padStart(2, '0');
const todayIso = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) };
const isoOf = t => new Date(t).toISOString().slice(0, 10);
const tOf = iso => Date.parse(iso + 'T00:00:00Z');
const dow = iso => (new Date(iso + 'T00:00:00Z').getUTCDay() + 6) % 7;
const dayLabel = iso => DN[dow(iso)] + ' ' + Number(iso.slice(8, 10));
const grp = t => { t = (t || '').replace(/\s/g, ''); if (/Run/i.test(t)) return 'run'; if (/Ride|Bike|Cycl/i.test(t)) return 'ride'; return 'other' };
const fmtH = s => { const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h + 'h' + pad(m) };
const fmtMin = m => m >= 60 ? Math.floor(m / 60) + 'h' + pad(Math.round(m % 60)) : Math.round(m) + ' min';
const fmtD = d => new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: '2-digit', timeZone: 'UTC' });
const fmtS = t => new Date(t).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', timeZone: 'UTC' });
const weekStart = s => { const d = new Date(s); const k = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - k); d.setUTCHours(0, 0, 0, 0); return d.getTime() };
const curWeek = () => weekStart(todayIso() + 'T00:00:00Z');
const gT = g => tOf(g.date);
const nbr = n => Math.round(n).toLocaleString('fr-FR');
const pill = (k, t) => '<span class="pill" style="background:var(--k-' + k + ')">' + esc(t) + '</span>';
const KINDS = { base: 'Base', spec: 'Spécifique', recup: 'Allégée', taper: 'Affûtage', race: 'Course', post: 'Récupération' };
const det = (k, sum, body, dflt, cls) => '<details' + (cls ? ' class="' + cls + '"' : '') + ' data-k="' + k + '"' + ((k in openK ? openK[k] : dflt) ? ' open' : '') + ' ontoggle="openK[this.dataset.k]=this.open"><summary>' + sum + '</summary>' + body + '</details>';
function log(m) {
  const e = $('#log'); if (e) e.textContent = m;
  const s = $('#status'); if (s) s.textContent = String(m).split('\n')[0].slice(0, 90);
}
const prioOf = g => g.prio || 'A';
const imgSrc = g => g.imgData || g.img || 'trail1.jpg';

/* vélotaf : trajet marqué dans Strava, ou sortie vélo courte (hors gravel/VTT) */
const isCommute = a => grp(a.type) === 'ride' && (a.commute || (!/Gravel|Mountain|Virtual/i.test(a.type) && a.dist / 1000 <= (prof.commuteKm || 36)));
const outing = a => grp(a.type) === 'ride' && !isCommute(a) && a.time >= 2700;
const weekRuns = t => acts.filter(a => grp(a.type) === 'run' && weekStart(a.date) === t).sort((a, b) => a.date.localeCompare(b.date));

function parseCSV(t) {

  const auto = { vol: clamp(Math.round(v / 4) || 35, 15, 120), long: Math.round(lr) || 12, bike: Math.round(b / 4) || 90 };

function qualityText(o) {

}

function buildWeek(o) {

  let runs = [];

  } else if (kind === 'post') {

      { k: 'e', d: 'Samedi', t: 'Footing facile ou marche active', km: Math.max(0, Math.round(o.vol) - e), x: '' }];
  } else if (kind === 'race') {

function assignDays(w) {

  if (t < cur) return res;
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => isoOf(t + i * DAY));
  const taken = {};
  res.forEach(r => { if (r.fixed) { taken[r.iso] = 'r'; if (r.iso < today) r.done = true } });
  if (t === cur) {
    const real = weekRuns(t).filter(a => !taken[a.date.slice(0, 10)]).sort((a, b) => b.dist - a.dist);
    const todo = res.filter(r => !r.fixed).sort((a, b) => (b.km || 0) - (a.km || 0));
    real.forEach((a, i) => { const s = todo[i]; if (s) { s.done = true; s.iso = a.date.slice(0, 10); taken[s.iso] = taken[s.iso] || s.k } });
  }

}

function applyAct(mi, ai) {
  const m = chat[mi]; if (!m || !m.actions) return;
  if (!Array.isArray(m.applied)) m.applied = [];
  if (m.applied[ai]) return;
  const a = m.actions[ai];
  if (a.do === 'edit_session') {
    const w = plan && plan.weeks.find(x => x.t === weekStart(a.sessionDate + 'T00:00:00Z'));
    const found = w && assignDays(w).some(r => r.iso === a.sessionDate && r.t === a.sessionTitle && !r.race);
    if (!found) return alert('Je ne retrouve plus cette séance dans le planning actuel. Demandez au coach une nouvelle proposition à partir du programme affiché.');
  }
  if (!confirm('Confirmer cette modification du programme ?\n\n' + actLabel(a) + '\n\nAucune modification ne sera faite si vous annulez.')) return;
  if (a.do === 'add_absence') absences.push({ id: 'a' + Date.now() + ai, name: a.name || 'Absence', start: a.start, end: a.end, runPct: clamp(+a.runPct || 0, 0, 100), bike: !!a.bike, confirmed: true }), save(KB, absences);
  else if (a.do === 'add_goal') goals.push({ id: 'g' + Date.now() + ai, name: a.name, type: a.gtype, date: a.date, runKm: +a.runKm || 0, rideKm: +a.rideKm || 0, elev: '', prio: a.prio, img: IMGS[goals.length % 3], confirmed: true }), save(KG, goals);
  else if (a.do === 'days_off') { a.dates.forEach(d => { if (d >= todayIso() && !offs.includes(d)) offs.push(d) }); save(KO, offs) }
  else if (a.do === 'scale_week') { adj[isoOf(weekStart(a.week))] = clamp(+a.factor, 0.3, 1.2); save(KJ, adj) }
  else if (a.do === 'edit_session') { sessEdits[a.sessionDate] = { sessionDate: a.sessionDate, date: a.date, sessionTitle: a.sessionTitle, newTitle: a.newTitle, newKm: a.newKm, details: a.details }; save(KX, sessEdits) }
  m.applied[ai] = true; persistChat(); makePlan(true); paint();
}
async function sendCoach(text) {
  text = (text || ($('#cin') ? $('#cin').value : '')).trim(); if (!text || chatBusy) return;
  chat.push({ r: 'u', t: text });
  if (!cfg.aiEndpoint) {
    chat.push({ r: 'a', t: 'Pour discuter avec le coach, configurez l’adresse du relais OpenAI dans Réglages > Coach IA. Les conseils rapides du ressenti restent disponibles sans connexion.', actions: [], applied: [], err: true });
    persistChat(); return paint();
  }
  chatBusy = true; paint();
  try {
    const msgs = chat.filter(m => !m.err).slice(-12).map(m => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (msgs.length && msgs[0].role !== 'user') msgs.shift();
    const r = await fetch(cfg.aiEndpoint, { method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ system: COACH_SYS, context: coachContext(), messages: msgs }) });
    if (!r.ok) { const detail = (await r.text()).slice(0, 240); throw new Error('Relais OpenAI : HTTP ' + r.status + (detail ? ' · ' + detail : '')); }
    const j = await r.json();
    const p = parseCoach(j && (j.reply !== undefined || j.actions !== undefined) ? j : (j.text || ''));
    if (!p.text) throw new Error('Le relais OpenAI a renvoyé une réponse vide.');
    chat.push({ r: 'a', t: p.text, actions: p.actions, applied: [] });
  } catch (e) { chat.push({ r: 'a', t: 'Erreur : ' + netHint(e), actions: [], applied: [], err: true }) }
  chatBusy = false; persistChat(); paint();
}

  cfg.aiEndpoint = endpoint; delete cfg.ai; delete cfg.model; save(KC, cfg); log(endpoint ? 'Adresse du relais OpenAI enregistrée sur cet appareil.' : 'Connexion au coach désactivée.'); paint();
}
