<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MENDI Training">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v3.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<title>MENDI Training</title>
<style>
:root{--bg:#0c0d0f;--card:#17191c;--card2:#0f1113;--line:#2a2e33;--txt:#ece6d8;--mut:#9b9a93;--run:#f97316;--ride:#38bdf8;--ok:#4ade80;--warn:#facc15;--ko:#f87171;
--k-base:#38bdf8;--k-spec:#f97316;--k-recup:#4ade80;--k-taper:#a78bfa;--k-race:#facc15;--k-post:#9b9a93}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 16px calc(80px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.lg{width:42px;height:42px;border-radius:9px;flex:none}
h1{margin:0;font-size:19px;letter-spacing:.14em;font-weight:800}
h1 span{font-weight:400;letter-spacing:.06em;color:var(--mut)}
.sub{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sy{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:20px;flex:none}
nav{
  position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;
  background:rgba(8,9,10,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid rgba(236,230,216,.09);
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 30px rgba(0,0,0,.18)
}
nav button{
  position:relative;flex:1;min-width:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;padding:3px 0 2px;
  background:none;border:0;color:#777a7d;font-family:inherit;font-size:10px;font-weight:500;line-height:1.1;
  cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .2s ease
}
nav button .nav-icon{
  width:38px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:10px;transition:background .2s ease,transform .2s ease
}
nav button svg{
  width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.65;
  stroke-linecap:round;stroke-linejoin:round;display:block
}
nav button .nav-label{font-size:10px;letter-spacing:.015em;white-space:nowrap}
nav button.on{color:var(--run);font-weight:650}
nav button.on .nav-icon{background:rgba(249,115,22,.12);transform:translateY(-1px)}
nav button:focus-visible{outline:1px solid var(--run);outline-offset:-2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){nav button,nav button .nav-icon{transition:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.card h2{margin:0 0 8px;font-size:14px;color:var(--mut);font-weight:600}
.warn{border-color:#a16207;background:#241d08}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi b{display:block;font-size:22px}
.run{color:var(--run)}.ride{color:var(--ride)}.ok{color:var(--ok)}.ko{color:var(--ko)}.wn{color:var(--warn)}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.n{font-weight:600}
.m{color:var(--mut);font-size:13px}
.r{text-align:right;white-space:nowrap;font-size:13px}
.sess{padding:10px 0;border-bottom:1px solid var(--line)}
.sess:last-child{border:0}
.done .n{opacity:.55}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#0c0d0f}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;margin:6px 0 10px}
.bar>div{height:100%;background:var(--ok)}
input,select,textarea,button.b{width:100%;padding:10px;margin:4px 0 10px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:16px;font-family:inherit}
button.b{background:#2563eb;border-color:#2563eb;color:#fff;font-weight:600;margin-bottom:8px}
button.b.alt{background:transparent;border-color:var(--line);color:var(--txt)}
label{font-size:13px;color:var(--mut)}
#log{white-space:pre-wrap;font-size:13px;color:var(--mut);min-height:20px}
a{color:var(--ride)}
small{color:var(--mut)}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.legend span{margin-right:10px;font-size:12px;color:var(--mut)}
ul{padding-left:20px;margin:6px 0}
/* courses à venir */
.cars{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
.rc{flex:0 0 84%;height:190px;border-radius:14px;background-size:cover;background-position:center;position:relative;scroll-snap-align:center;color:#fff;overflow:hidden;border:1px solid var(--line)}
.rc .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.05) 70%)}
.rc .rt{position:absolute;left:14px;right:14px;bottom:12px}
.rc .rn{font-size:20px;font-weight:800;line-height:1.15;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.rc .rm{font-size:13px;color:#ddd}
.rc .pr{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35)}
.rc .jx{position:absolute;top:10px;left:10px;font-size:13px;font-weight:800;padding:2px 10px;border-radius:99px;background:var(--txt);color:#0c0d0f}
/* semaine */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 12px}
.dy{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 1px;text-align:center;font-size:10.5px;min-height:84px;overflow:hidden}
.dy b{display:block;font-size:12px}
.dy .dd{color:var(--mut);font-size:11px}
.dy.today{border-color:var(--txt)}
.dy.past{opacity:.85}
.dy.off{opacity:.55;background:repeating-linear-gradient(45deg,#101215,#101215 6px,#1a1d21 6px,#1a1d21 12px)}
.dy .tg{font-size:9px;font-weight:700;color:var(--ko)}
.dy .pl{color:var(--run);font-weight:600;margin-top:2px}
.dy .pl.dn2{opacity:.45;text-decoration:line-through}
.dy .av{margin-top:2px;font-weight:600}
/* coach */
.msg{padding:8px 10px;border-radius:10px;margin:6px 0;font-size:14px;white-space:pre-wrap}
.msg.u{background:#1d3a6e;margin-left:24px}
.msg.a{background:var(--card2);border:1px solid var(--line);margin-right:12px}
.adv{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0 10px}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px;align-items:center}
.th{width:64px;height:44px;border-radius:8px;background-size:cover;background-position:center;border:2px solid transparent;opacity:.65}
.th.sel{border-color:var(--txt);opacity:1}

/* Objectifs : cartes horizontales compactes */
.goal-list{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px -16px 12px;padding:2px 16px 10px;-webkit-overflow-scrolling:touch;}
.goal-card{flex:0 0 76%;max-width:300px;min-width:220px;scroll-snap-align:start;border:1px solid rgba(174,190,205,.16);border-radius:15px;overflow:hidden;background:#101419;}
.goal-card>summary{list-style:none;cursor:pointer;}
.goal-card>summary::-webkit-details-marker{display:none;}
.goal-tile{height:142px;position:relative;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:space-between;padding:12px;color:#fff;isolation:isolate;}
.goal-tile:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.34),rgba(0,0,0,.06) 35%,rgba(0,0,0,.82));z-index:-1;}
.goal-tile-top,.goal-tile-bottom{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.goal-tile-top{font-size:11px;font-weight:750;text-shadow:0 1px 4px #000;}
.goal-tile-top .goal-prio{padding:4px 8px;border-radius:99px;background:rgba(0,0,0,.48);border:1px solid rgba(255,255,255,.28);}
.goal-tile-top .goal-count{padding:4px 8px;border-radius:99px;background:rgba(242,241,236,.92);color:#101419;text-shadow:none;}
.goal-tile-bottom{display:block;}
.goal-tile-bottom b{display:block;font-size:16px;line-height:1.15;margin-bottom:4px;text-shadow:0 1px 5px #000;}
.goal-tile-bottom span{display:block;font-size:11px;color:rgba(255,255,255,.88);text-shadow:0 1px 4px #000;}
.goal-card[open]{flex-basis:88%;max-width:360px;}
@media(min-width:700px){.goal-card{flex-basis:260px;}}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid var(--line)}
.gb{height:10px}

/* MENDI Training — identité premium & performance */
:root{--bg:#0a0c0f;--card:#14181d;--card2:#101419;--line:#29313a;--txt:#f2f1ec;--mut:#929ba5;--run:#ff7138;--ride:#55c7f2;--ok:#55d69a;--warn:#f4c95d;--ko:#ff7777}
body{background:radial-gradient(ellipse at 50% -18%,rgba(255,113,56,.09),transparent 42%),var(--bg);letter-spacing:.005em}
.brand{gap:12px}
.lg{border:1px solid rgba(255,255,255,.12);box-shadow:0 5px 18px rgba(0,0,0,.28)}
h1{font-size:18px;letter-spacing:.16em;font-weight:850;line-height:1.05}
h1 span{display:block;margin-top:4px;font-size:9px;font-weight:750;letter-spacing:.27em;color:var(--mut)}
.sub{margin-top:4px}
.card{background:linear-gradient(145deg,rgba(25,30,36,.98),rgba(18,22,27,.98));border:1px solid rgba(174,190,205,.13);border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.card h2{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:#aeb7c0}
.kpi b{font-size:25px;letter-spacing:-.035em;font-weight:780}
.pill{font-size:10px;letter-spacing:.045em;text-transform:uppercase}
button.b{background:linear-gradient(135deg,#ff7a3d,#e85b25);border-color:#ff7a3d;box-shadow:0 5px 16px rgba(255,113,56,.16)}
button.b.alt{background:rgba(255,255,255,.025)}
input:focus,select:focus,textarea:focus,button.b:focus-visible,#sy:focus-visible{outline:2px solid rgba(255,113,56,.72);outline-offset:2px;border-color:var(--run)}
#sy{background:linear-gradient(145deg,#1b2229,#11161b);border-color:rgba(174,190,205,.18)}
nav{background:rgba(9,12,15,.88);border-top-color:rgba(174,190,205,.13);box-shadow:0 -12px 34px rgba(0,0,0,.32)}
nav button.on .nav-icon{background:linear-gradient(145deg,rgba(255,113,56,.19),rgba(255,113,56,.07));box-shadow:inset 0 0 0 1px rgba(255,113,56,.12)}
.rc{border-radius:17px;border:0;box-shadow:none}
.rc .pr{border:0}
.msg.u{background:rgba(37,99,235,.22);border:1px solid rgba(85,199,242,.15)}
.msg.a,.adv{background:#11161b;border-color:rgba(174,190,205,.13)}
@media(min-width:700px){body{max-width:760px;margin:0 auto}.cars{margin-left:-16px;margin-right:-16px}}


/* Coach MENDI — page dédiée et historique indépendant */
nav button{font-size:9px}
nav button .nav-label{font-size:9px;letter-spacing:0}
.coach-hero{background:linear-gradient(145deg,rgba(30,43,54,.98),rgba(17,23,29,.98));border:1px solid rgba(85,199,242,.18);border-radius:18px;padding:16px;margin:12px 0}
.coach-shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.coach-shortcuts button{margin:0;text-align:left;background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:10px;font-size:13px}
.coach-chat{display:flex;flex-direction:column;gap:8px}
.coach-messages{display:flex;flex-direction:column;gap:5px;max-height:none;overflow:visible}
.coach-compose{position:sticky;bottom:72px;background:rgba(23,31,39,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(174,190,205,.18);border-radius:16px;padding:10px;margin:12px 0 calc(8px + env(safe-area-inset-bottom));z-index:5;display:flex;gap:8px;align-items:flex-end;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.coach-compose input{margin:0;min-width:0;flex:1;background:rgba(255,255,255,.06);border-color:rgba(174,190,205,.2)}
.coach-compose button{width:auto;min-width:48px;margin:0;padding:10px 14px}
.chat-tools{display:flex;gap:8px;flex-wrap:wrap}
.chat-tools button{width:auto;margin:0;font-size:12px;padding:8px 10px}
.archive-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.archive-item:last-child{border:0}
.archive-item .archive-title{min-width:0;flex:1}
.archive-item button{width:auto;margin:0;padding:7px 9px;font-size:12px}
@media(min-width:700px){.coach-compose{bottom:12px}}


/* Progression MENDI */
.prog-switch{display:flex;gap:8px;margin:10px 0}
.prog-switch button{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--mut);border-radius:9px;padding:10px;font:600 13px system-ui;cursor:pointer}
.prog-switch button.on{border-color:var(--run);background:rgba(255,113,56,.15);color:var(--txt)}
.prog-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.prog-kpi{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:11px;padding:11px;min-width:0}
.prog-kpi span{font-size:11px;color:var(--mut);display:block}
.prog-kpi b{font-size:21px;display:block;letter-spacing:-.03em;margin:4px 0}
.prog-kpi small{font-size:11px;display:block}
.prog-note{font-size:12px;color:var(--mut);line-height:1.5;margin:9px 0 0}
.prog-svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<header>
  <div class="brand"><img class="lg" src="logo.png" alt=""><div style="min-width:0"><h1>MENDI <span>TRAINING</span></h1><div class="sub" id="status"></div></div></div>
  <button id="sy" onclick="sync()" title="Synchroniser Strava">↻</button>
</header>
<main id="view"></main>
<nav aria-label="Navigation principale">
  <button data-t="home" aria-label="Accueil">
    <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9M9 20v-6h6v6"/></svg></span>
    <span class="nav-label">Accueil</span>
  </button>
  <button data-t="plan" aria-label="Programme">
    <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M7.5 3v4M16.5 3v4M3.5 10h17M8 14h3M8 17h7"/></svg></span>
    <span class="nav-label">Programme</span>
  </button>
  <button data-t="coach" aria-label="Coach MENDI">
    <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a7 7 0 0 0-4 12.7V19h8v-3.3A7 7 0 0 0 12 3Z"/><path d="M9 22h6M9 16h6M9.5 9.5l1.5 1.5 3-3"/></svg></span>
    <span class="nav-label">Coach</span>
  </button>
  <button data-t="progress" aria-label="Progression">
    <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19V5M3 19h18"/><path d="m6 15 4-4 3 2 6-7"/></svg></span>
    <span class="nav-label">Progression</span>
  </button>
  <button data-t="acts" aria-label="Activités">
    <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3l2.2-6 4.1 12 2.5-7 1.5 3H21"/></svg></span>
    <span class="nav-label">Activités</span>
  </button>
  <button data-t="gear" aria-label="Matériel">
    <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="17" r="4"/><circle cx="18" cy="17" r="4"/><path d="m6 17 4-8 4 8H6l3-5h6l3 5M9 9h3M15 7h2"/></svg></span>
    <span class="nav-label">Matériel</span>
  </button>
  <button data-t="cfg" aria-label="Réglages">
    <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.1 1.9-2 2-1.9-1.1a8 8 0 0 1-1.5.6l-.6 2.1h-2.8l-.6-2.1a8 8 0 0 1-1.5-.6L7.8 19l-2-2 1.1-1.9a8 8 0 0 1-.6-1.5L4.2 13v-2.8l2.1-.6a8 8 0 0 1 .6-1.5L5.8 6.2l2-2 1.9 1.1a8 8 0 0 1 1.5-.6l.6-2.1h2.8l.6 2.1a8 8 0 0 1 1.5.6l1.9-1.1 2 2-1.1 1.9a8 8 0 0 1 .6 1.5l2.1.6V13l-2.1.6a8 8 0 0 1-.6 1.4Z"/></svg></span>
    <span class="nav-label">Réglages</span>
  </button>
</nav>

<script>
const $ = s => document.querySelector(s);
const KC = 'bt_cfg', KA = 'bt_acts', KG = 'bt_goals', KP = 'bt_plan', KF = 'bt_prof', KB = 'bt_abs', KO = 'bt_off', KR = 'bt_feel', KM = 'bt_maint', KS = 'bt_gear', KH = 'bt_chat', KJ = 'bt_adj', KX = 'bt_session_edits', KTH = 'bt_chat_threads', KAH = 'bt_chat_archives', KAC = 'bt_chat_active';
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? d : v } catch (e) { return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) { log('Stockage local plein ou indisponible.') } };
let cfg = load(KC, {}), acts = load(KA, []), goals = load(KG, null), plan = load(KP, null), prof = load(KF, {}), absences = load(KB, null),
  offs = load(KO, []), feels = load(KR, []), maint = load(KM, []), gears = load(KS, []), chat = load(KH, []), adj = load(KJ, {}), sessEdits = load(KX, {});
let tab = 'home', filt = 'all', chatBusy = false, progressWeeks = 12; const openK = {}, imgSel = {}, imgTmp = {};
let chatThreads = load(KTH, []), archivedChats = load(KAH, []), activeChatId = load(KAC, '');
// Migration de l'ancien historique unique vers une conversation active indépendante.
if (!chatThreads.length) {
  activeChatId = 'mendi-' + Date.now();
  chatThreads = [{ id: activeChatId, title: 'Conversation principale', updated: Date.now(), messages: chat.slice(-30) }];
  save(KTH, chatThreads); save(KAC, activeChatId);
} else if (!chatThreads.some(t => t.id === activeChatId)) {
  activeChatId = chatThreads[0].id; save(KAC, activeChatId);
}
let activeThread = chatThreads.find(t => t.id === activeChatId) || chatThreads[0];
chat = Array.isArray(activeThread.messages) ? activeThread.messages : chat;

// Migration sécurisée : supprime une éventuelle ancienne clé Anthropic stockée localement.
if (cfg.ai) { delete cfg.ai; delete cfg.model; save(KC, cfg); }
const DAY = 864e5, WK = 7 * DAY;
const DN = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'], DS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'], DL = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
const LBL = { l: 'Longue', q: 'Qualité', e: 'Footing', r: 'Course' };
const IMGS = ['trail1.jpg', 'trail2.jpg', 'trail3.jpg'];
const defImg = (g, i) => /montagn|hard|lary/i.test(g.name) ? 'trail1.jpg' : /korrikei|basque/i.test(g.name) ? 'trail2.jpg' : /gravel/i.test(g.name) ? 'trail3.jpg' : IMGS[i % 3];

if (!goals) {
  goals = [
    { id: 'g1', name: 'Montagn’hard 42 km', type: 'trail', date: '2027-05-16', runKm: 42, rideKm: 0, elev: '', prio: 'A', img: 'trail1.jpg', confirmed: false },
    { id: 'g2', name: 'Gravel & trail', type: 'combo', date: '2027-09-18', runKm: 21, rideKm: 125, elev: '', prio: 'A', img: 'trail3.jpg', confirmed: false },
    { id: 'g3', name: 'Korrikei (Pays basque)', type: 'trail', date: '2026-11-22', runKm: 22, rideKm: 0, elev: '', prio: 'B', img: 'trail2.jpg', confirmed: true }
  ];
  save(KG, goals);
}

async function sendCoach(text) {
  text = (text || ($('#cin') ? $('#cin').value : '')).trim(); if (!text || chatBusy) return;
  chat.push({ r: 'u', t: text });
  if (!cfg.aiEndpoint) {
    chat.push({ r: 'a', t: 'Pour discuter avec le coach, configurez l’adresse du relais OpenAI dans Réglages > Coach IA. Les conseils rapides du ressenti restent disponibles sans connexion.', actions: [], applied: [], err: true });
    persistChat(); return paint();
  }
  chatBusy = true; paint();
  try {
    const msgs = chat.filter(m => !m.err).slice(-12).map(m => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
    while (msgs.length && msgs[0].role !== 'user') msgs.shift();
    const r = await fetch(cfg.aiEndpoint, { method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ system: COACH_SYS + COACH_DATA_SYS, context: coachContext(), program: coachProgramData(), messages: msgs }) });
    if (!r.ok) { const detail = (await r.text()).slice(0, 240); throw new Error('Relais OpenAI : HTTP ' + r.status + (detail ? ' · ' + detail : '')); }
    const j = await r.json();
    const p = parseCoach(j && (j.reply !== undefined || j.actions !== undefined) ? j : (j.text || ''));
    if (!p.text) throw new Error('Le relais OpenAI a renvoyé une réponse vide.');
    if (p.programProposal) chat.forEach(m => { if (m.r === 'a' && m.programProposal && !m.programApplied && !m.programRejected) m.programSuperseded = true; });
    chat.push({ r: 'a', t: p.text, actions: p.actions, applied: [], programProposal: p.programProposal, programApplied: false });
  } catch (e) { chat.push({ r: 'a', t: 'Erreur : ' + netHint(e), actions: [], applied: [], err: true }) }
  chatBusy = false; persistChat(); paint();
}

function progressWeeksData(n) {

    const drifts=runs.map(a=>detail[String(a.id)]).filter(d=>d && Number.isFinite(Number(d.cardiacDriftPct)) && d.cardiacDriftPct!==undefined && d.cardiacDriftPct!==null);
    out.push({t,runs,runKm:sum(runs,'dist')/1000,rideKm:sum(rides,'dist')/1000,

      commuteKm:sum(commutes,'dist')/1000,commuteSec:sum(commutes,'time'),

  const sum=(list,key)=>list.reduce((v,x)=>v+x[key],0), avg=(list,key)=>list.length?sum(list,key)/list.length:0;
  const kpi=(title,value,sub,cls='')=>'<div class="prog-kpi"><span>'+title+'</span><b class="'+cls+'">'+value+'</b><small>'+sub+'</small></div>';
  const matched=progMatchedPace(rows), drifts=past.filter(w=>w.drift!==null), driftN=sum(past,'driftN');
  let html='<div class="card"><h2>Progression · '+progressWeeks+' semaines</h2><div class="prog-switch"><button class="'+(progressWeeks===6?'on':'')+'" onclick="progressWeeks=6;paint()">6 semaines</button><button class="'+(progressWeeks===12?'on':'')+'" onclick="progressWeeks=12;paint()">12 semaines</button></div><p class="prog-note">Les graphiques incluent la semaine en cours ; les bilans et comparaisons portent uniquement sur les semaines terminées.</p></div>';
  html+='<div class="card"><h2>Vue d’ensemble</h2><div class="prog-grid">';
  html+=kpi('Course à pied',sum(past,'runKm').toFixed(1)+' km',avg(past,'runKm').toFixed(1)+' km / semaine','run');
  html+=kpi('Vélo total',sum(past,'rideKm').toFixed(0)+' km',fmtH(sum(past,'rideSec'))+' · vélotaf inclus','ride');
  html+=kpi('Sortie la plus longue',Math.max(0,...past.map(x=>x.longKm)).toFixed(1)+' km','Course à pied');
  html+=kpi('Temps total',fmtH(sum(past,'runSec')+sum(past,'rideSec')),'Course + vélo, vélotaf inclus');
  html+='</div></div>';
  html+='<div class="card"><h2>Volume de course · km / semaine</h2>'+progChart(rows,'runKm','var(--run)','km de course')+'</div>';
  html+='<div class="card"><h2>Sortie longue · km / semaine</h2>'+progChart(rows,'longKm','var(--ok)','km de la plus longue sortie')+'</div>';
  html+='<div class="card"><h2>Vélo total · km / semaine</h2>'+progChart(rows,'rideKm','var(--ride)','km de vélo')+
    '<div class="prog-grid">'+kpi('Dont vélotaf',sum(past,'commuteKm').toFixed(0)+' km',fmtH(sum(past,'commuteSec'))+' de trajet')+
    kpi('Autres sorties vélo',sum(past,'leisureKm').toFixed(0)+' km',fmtH(sum(past,'leisureSec'))+' de vélo')+'</div>'+
    '<p class="prog-note">Les trajets vélotaf classiques sont comptabilisés dans le volume et le temps d’activité. Les VAE restent exclus. La classification vélotaf utilise les règles déjà présentes dans MENDI.</p></div>';
  html+='<div class="card"><h2>Allure à fréquence cardiaque comparable</h2>';
  if(matched.ok){const d=matched.recent-matched.old;
    html+='<div class="prog-grid">'+kpi('Première période',progPace(matched.old),matched.n1+' sorties')+kpi('Période récente',progPace(matched.recent),matched.n2+' sorties')+'</div>';
    html+='<p class="prog-note">FC moyenne dans la tranche '+matched.band+'–'+(matched.band+4)+' bpm : '+(Math.abs(d)<1?'allure quasi stable':d<0?'environ '+Math.abs(Math.round(d))+' s/km plus rapide':'environ '+Math.abs(Math.round(d))+' s/km plus lente')+'.</p>';
  }else html+='<p>Pas assez de sorties comparables pour établir une tendance fiable.</p>';
  html+='<p class="prog-note">Critères : au moins 2 sorties par période dans la même tranche de FC de 5 bpm, 5 à 25 km, D+ ≤ 15 m/km. L’allure reste sensible au terrain, à la météo, aux pauses et au type de séance : c’est un indicateur, pas une preuve de progression physiologique.</p></div>';
  html+='<div class="card"><h2>Dérive cardiaque</h2>';
  if(driftN)html+='<div class="prog-grid">'+kpi('Moyenne des semaines analysées',(drifts.reduce((v,x)=>v+x.drift*x.driftN,0)/driftN).toFixed(1)+' %',driftN+' sorties analysées')+kpi('Semaines documentées',drifts.length+'/'+past.length,'avec dérive disponible')+'</div>';
  else html+='<p class="prog-note">Aucune dérive calculée pour cette période. Dans Réglages → Données détaillées pour le coach, lancez « Analyser mes sorties ».</p>';
  html+='<p class="prog-note">La dérive est issue des analyses détaillées Strava lorsqu’elles existent. Elle ne doit pas être interprétée isolément.</p></div>';
  html+='<div class="card"><h2>Comparaison des deux périodes</h2>';
  html+='<div class="row"><div><b>Volume hebdomadaire de course</b><div class="m">Moyenne des semaines terminées</div></div><div class="r">'+avg(old,'runKm').toFixed(1)+' → '+avg(recent,'runKm').toFixed(1)+' km</div></div>';
  html+='<div class="row"><div><b>Sortie la plus longue</b><div class="m">Maximum dans chaque période</div></div><div class="r">'+Math.max(0,...old.map(x=>x.longKm)).toFixed(1)+' → '+Math.max(0,...recent.map(x=>x.longKm)).toFixed(1)+' km</div></div>';
  html+='<p class="prog-note">Comparaison descriptive, sans jugement automatique sur la charge ou la récupération.</p></div>';
  return html;
}

function vActs() {
  if (!acts.length) return '<div class="card">Aucune activité. Allez dans <b>Réglages</b> pour synchroniser Strava, importer un CSV ou charger la démo.</div>';
  const last = acts.filter(a => Date.now() - Date.parse(a.date) <= 28 * DAY);
  const r = agg(last, 'run'), b = agg(last, 'ride');
  const runs = acts.filter(a => grp(a.type) === 'run'), withHr = runs.filter(a => a.hr).length, pct = runs.length ? Math.round(withHr / runs.length * 100) : 0;
  const l = acts.filter(a => filt === 'all' || grp(a.type) === filt).slice(0, 150);
  return '<div class="card"><h2>28 derniers jours</h2><div class="kpis">' +
    '<div class="kpi"><span class="run">Course</span><b>' + r.km.toFixed(0) + ' km</b><small>' + fmtH(r.h) + ' · ' + r.d.toFixed(0) + ' m D+ · ' + r.n + ' sorties</small></div>' +
    '<div class="kpi"><span class="ride">Vélo</span><b>' + b.km.toFixed(0) + ' km</b><small>' + fmtH(b.h) + ' · ' + b.d.toFixed(0) + ' m D+ · ' + b.n + ' sorties</small></div></div></div>' +
    '<div class="card"><h2>Heures par semaine (26 sem.) <span class="run">■ course</span> <span class="ride">■ vélo</span></h2>' + actsChart() +
    '<small>' + acts.length + ' activités · courses avec FC : ' + withHr + '/' + runs.length + ' (' + pct + ' %)</small></div>' +
    '<select onchange="filt=this.value;paint()">' + [['all', 'Tout'], ['run', 'Course à pied'], ['ride', 'Vélo']].map(([v, t]) => '<option value="' + v + '"' + (filt === v ? ' selected' : '') + '>' + t + '</option>').join('') + '</select>' +
    '<div class="card">' + (l.map(a => '<div class="row"><div><div class="n ' + grp(a.type) + '">' + esc(a.name) + '</div><div class="m">' + fmtD(a.date) + ' · ' + esc(a.type) + (isCommute(a) ? ' · vélotaf' : '') + (a.gear ? ' · ' + esc(gearName(a.gear)) : '') + '</div></div>' +
      '<div class="r">' + (a.dist / 1000).toFixed(1) + ' km · ' + fmtH(a.time) + '<br>' + Math.round(a.elev) + ' m D+' + (a.hr ? ' · ' + Math.round(a.hr) + ' bpm' : '') + '</div></div>').join('') || 'Rien à afficher.') + '</div>';
}
function vCfg() {
  const au = startStats(true);
  return det('c1', '<h2 style="margin:0">Connexion Strava ' + (cfg.refresh ? '<span class="ok">● connecté</span>' : '') + '</h2>',
    '<div style="margin-top:10px"><div class="m" style="margin-bottom:8px">Sur iPhone, saisissez ces informations dans l’app ouverte depuis l’icône de l’écran d’accueil : elle a son propre stockage, distinct de Safari. Une seule fois suffit ensuite.</div>' +
    '<label>Client ID</label><input id="cid" inputmode="numeric" value="' + esc(cfg.id) + '">' +
    '<label>Client Secret</label><input id="csec" type="password" value="' + esc(cfg.secret) + '">' +
    '<button class="b alt" onclick="authLink()">Lien d’autorisation (accès activités + profil)</button><div id="auth"></div>' +
    '<label>Code (ou adresse localhost complète)</label><input id="ccode">' +
    '<button class="b alt" onclick="exchange()">Échanger le code</button>' +
    '<label>Refresh token</label><input id="cref" type="password" value="' + esc(cfg.refresh) + '">' +
    '<button class="b" onclick="sync()">Synchroniser Strava</button>' +
    '<button class="b alt" onclick="saveCfg()">Enregistrer</button></div>', !cfg.refresh, 'card') +
    '<div class="card"><h2>Réglages du plan</h2><small>Estimés à partir de vos activités. Saisissez une valeur pour la forcer.</small>' +
    '<label>Volume de course (km par semaine), estimé : ' + au.vol + '</label><input id="pvol" type="number" inputmode="decimal" placeholder="' + au.vol + '" value="' + (prof.vol || '') + '">' +
    '<label>Plus longue sortie à pied (km), estimée : ' + au.long + '</label><input id="plong" type="number" inputmode="decimal" placeholder="' + au.long + '" value="' + (prof.long || '') + '">' +
    '<label>Distance maximale d’un vélotaf (km, par défaut 36)</label><input id="pcom" type="number" inputmode="decimal" placeholder="36" value="' + (prof.commuteKm || '') + '">' +
    '<button class="b alt" onclick="saveProf()">Enregistrer et recalculer le plan</button></div>' +
    det('c4', '<h2 style="margin:0">Données détaillées pour le coach</h2>',
    '<div style="margin-top:10px"><div class="m" style="margin-bottom:8px">Récupère pour chaque sortie la courbe de fréquence cardiaque, l’allure et l’altitude, puis calcule sur l’appareil : zones FC, charge, dérive cardiaque, montées/descentes, meilleurs efforts. Le coach reçoit un résumé compact, pas les milliers de points bruts.</div>' +
    '<div id="anaStat" class="m"><b>' + (() => { const c = anaCount(); return c.done + ' / ' + c.total + ' sorties analysées (' + ANA_DAYS + ' derniers jours)' })() + '</b></div>' +
    '<button class="b" onclick="analyseAll(40)">Analyser mes sorties</button>' +
    '<label>Niveau de détail envoyé au coach</label><select onchange="cfg.coachDetail=this.value;save(KC,cfg)">' +
    [['light', 'Léger : indicateurs seulement'], ['std', 'Standard : + courbes des 8 dernières sorties'], ['full', 'Détaillé : + courbes des 15 dernières sorties']].map(o => '<option value="' + o[0] + '"' + ((cfg.coachDetail || 'std') === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>' +
    '<label><input type="checkbox" style="width:auto;margin-right:8px"' + (cfg.autoAna !== false ? ' checked' : '') + ' onchange="cfg.autoAna=this.checked;save(KC,cfg)">Analyser automatiquement après chaque synchronisation</label>' +
    '<button class="b alt" onclick="showSent()">Voir ce qui est envoyé au coach</button><div id="anaPrev"></div>' +
    '<button class="b alt" onclick="resetAna()">Effacer et refaire les analyses</button>' +
    '<small class="m">Si les zones FC Strava sont inaccessibles, elles sont estimées à partir de votre FC max. Si une analyse échoue, refaites l’autorisation Strava (accès activités complet).</small></div>', false, 'card') +
    det('c2', '<h2 style="margin:0">Coach IA OpenAI ' + (cfg.aiEndpoint ? '<span class="ok">● configuré</span>' : '') + '</h2>',
    '<div style="margin-top:10px"><div class="m" style="margin-bottom:8px">Le coach passe par un petit relais sécurisé hébergé séparément (Cloudflare Worker). La clé OpenAI reste côté serveur et n’est jamais enregistrée dans cette application. L’API OpenAI est facturée à l’usage, indépendamment de ChatGPT Plus/Free.</div>' +
    '<label>Adresse HTTPS du relais Cloudflare</label><input id="aiendpoint" type="url" placeholder="https://mendi-coach.votre-compte.workers.dev" value="' + esc(cfg.aiEndpoint || '') + '">' +
    '<small class="m">Collez ici l’URL du Worker après son déploiement. Ne collez pas votre clé OpenAI dans ce champ.</small>' +
    '<button class="b" onclick="saveAI()">Enregistrer l’adresse</button></div>', false, 'card') +
    det('c3', '<h2 style="margin:0">Sauvegarde et transfert</h2>', '<div style="margin-top:10px"><div class="m" style="margin-bottom:8px">Pour passer de Safari à l’app de l’écran d’accueil, ou vers un autre appareil : « Générer » ici, collez le texte dans l’autre appareil, puis « Restaurer ». Le texte contient vos clés : ne le partagez pas.</div>' +
    '<textarea id="xp" rows="4" placeholder="Sauvegarde…"></textarea><button class="b alt" onclick="exportData()">Générer la sauvegarde</button><button class="b alt" onclick="importData()">Restaurer depuis le texte collé</button></div>', false, 'card') +
    '<div class="card"><h2>Plan B : export Strava</h2><small>Archive Strava, fichier <b>activities.csv</b>.</small><input type="file" accept=".csv,text/csv" onchange="importCSV(this)"></div>' +
    '<div class="card"><h2>Autres</h2><button class="b alt" onclick="demo()">Charger des données de démo</button><button class="b alt" onclick="wipe()">Tout effacer</button></div>' +
    '<div class="card"><div id="log"></div></div>';
}
function paintStatus() { const s = $('#status'); if (s) s.textContent = acts.length ? acts.length + ' activités' + (cfg.last ? ' · synchro ' + new Date(cfg.last).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '') : 'Aucune donnée' }
function paint() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('#view').innerHTML = tab === 'home' ? vHome() : tab === 'plan' ? vPlan() : tab === 'coach' ? coachPage() : tab === 'progress' ? vProgress() : tab === 'acts' ? vActs() : tab === 'gear' ? vGear() : vCfg();
  paintStatus();
  if (tab === 'plan' && plan) { const sc = $('#psc'); if (sc) { const i = plan.weeks.findIndex(w => w.t >= curWeek()); sc.scrollLeft = Math.max(0, i * 18 - 80) } }
  if (tab === 'coach') { const input = $('#cin'); if (input && chatBusy) input.blur(); }
}
function migrate() {
  if (!load('bt_mig3', false)) {
    goals.forEach(g => { if (!g.prio) g.prio = 'A' });
    if (!goals.some(g => /korrikei/i.test(g.name))) goals.push({ id: 'g3', name: 'Korrikei (Pays basque)', type: 'trail', date: '2026-11-22', runKm: 22, rideKm: 0, elev: '', prio: 'B', confirmed: true });
    save(KG, goals); save('bt_mig3', true);
  }
  if (!load('bt_mig4', false)) {
    goals.forEach((g, i) => { if (!g.img) g.img = defImg(g, i) }); save(KG, goals);
    cfg.last = 0; save(KC, cfg);
    if (plan && plan.source !== 'coach') makePlan(true);
    save('bt_mig4', true);
  }
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; paint(); window.scrollTo && window.scrollTo(0, 0) });
migrate(); syncGearsFromActs(); persistChat(); paint();
if (cfg.refresh && cfg.id && cfg.secret && (!cfg.last || Date.now() - cfg.last > 6 * 36e5)) sync();
</script>
</body>
</html>
